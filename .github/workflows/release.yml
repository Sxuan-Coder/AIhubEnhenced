name: 自动发布 Release

on:
  push:
    tags:
      - "v*.*.*" # 匹配 v1.0.0, v0.1.0 等版本标签

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写权限来创建 Release

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史用于生成更新日志

      - name: 获取版本号
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: 生成更新日志
        id: changelog
        run: |
          # 获取上一个 tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            # 如果没有上一个 tag，获取所有提交
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # 获取两个 tag 之间的提交
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # 转义换行符并保存到输出
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

          # 输出预览
          echo "## 更新内容"
          git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges || git log --pretty=format:"- %s (%h)" --no-merges

      - name: 打包扩展 (Extension ZIP)
        run: |
          # 进入 extension 目录打包，确保 ZIP 根目录直接包含扩展文件
          cd extension
          zip -r ../AIhubEnhenced-${{ steps.get_version.outputs.version }}.zip \
            manifest.json \
            content.js \
            styles.css \
            jszip.min.js \
            icons/
          cd ..
          echo "打包完成: AIhubEnhenced-${{ steps.get_version.outputs.version }}.zip"
          ls -lh AIhubEnhenced-${{ steps.get_version.outputs.version }}.zip

          # 验证 ZIP 内容
          echo "验证 ZIP 结构:"
          unzip -l AIhubEnhenced-${{ steps.get_version.outputs.version }}.zip | head -20

      - name: 打包源代码 (Source ZIP)
        run: |
          zip -r AIhubEnhenced-source-${{ steps.get_version.outputs.version }}.zip \
            extension/ \
            scripts/ \
            openspec/ \
            README.md \
            AGENTS.md \
            -x "*.git*" -x "*node_modules*" -x "*.DS_Store"
          echo "源代码打包完成: AIhubEnhenced-source-${{ steps.get_version.outputs.version }}.zip"
          ls -lh AIhubEnhenced-source-${{ steps.get_version.outputs.version }}.zip

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          name: AIhubEnhenced ${{ steps.get_version.outputs.version }}
          body: |
            # AIhubEnhenced ${{ steps.get_version.outputs.version }}

            ## 更新内容

            ${{ steps.changelog.outputs.changelog }}

            ## 安装方法

            ### 方法一：直接加载解压文件（推荐）

            1. 下载 `AIhubEnhenced-${{ steps.get_version.outputs.version }}.zip`
            2. **解压到本地文件夹**
            3. 打开浏览器扩展管理页面
               - Chrome: `chrome://extensions/`
               - Edge: `edge://extensions/`
            4. 启用右上角的 **"开发者模式"**
            5. 点击 **"加载已解压的扩展程序"**
            6. 选择解压后的文件夹（包含 manifest.json 的文件夹）

            ### 方法二：直接拖放 ZIP（部分浏览器支持）

            1. 下载 `AIhubEnhenced-${{ steps.get_version.outputs.version }}.zip`
            2. 打开浏览器扩展管理页面并启用开发者模式
            3. 直接将 ZIP 文件拖放到扩展页面

            ## 支持的平台

            - ✅ Gemini
            - ✅ ChatGPT
            - ✅ Grok

            ## 文件说明

            - `AIhubEnhenced-${{ steps.get_version.outputs.version }}.zip` - 浏览器扩展包（推荐下载，解压后可直接加载）
            - `AIhubEnhenced-source-${{ steps.get_version.outputs.version }}.zip` - 完整源代码（包含所有项目文件）
            - `Source code (zip/tar.gz)` - GitHub 自动生成的源代码
          files: |
            AIhubEnhenced-${{ steps.get_version.outputs.version }}.zip
            AIhubEnhenced-source-${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布成功通知
        run: |
          echo "🎉 Release ${{ steps.get_version.outputs.version }} 已成功发布！"
          echo "📦 扩展包: AIhubEnhenced-${{ steps.get_version.outputs.version }}.zip"
          echo "📄 源代码: AIhubEnhenced-source-${{ steps.get_version.outputs.version }}.zip"
          echo "🔗 访问: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }}"
